/* --- Navigation Bar Styling --- */
.navbar {
  background-color: var(--green-dark);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-md);
}
.nav-tabs {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.tab-btn {
  background: transparent;
  color: var(--white);
  border: none;
  padding: 8px 14px;
  border-radius: var(--radius);
  text-decoration: none;
  cursor: pointer;
  font-size: 15px;
  font-family: inherit;
  transition: background 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.tab-btn:hover, .tab-btn.active {
  background: rgba(255, 255, 255, 0.2);
}
.tab-btn.link-tab {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.tab-btn.link-tab:hover {
  background: rgba(255, 255, 255, 0.25);
}

/* ปุ่ม + สำหรับเพิ่มแถบรายการ */
.add-tab-btn {
  background: var(--gold);
  color: var(--gray-800);
  border: none;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: 6px;
  transition: transform 0.2s, background 0.2s;
}
.add-tab-btn:hover {
  background: var(--gold-light);
  transform: scale(1.1);
}

/* Modal ป๊อปอัปสำหรับเพิ่มแถบลิงก์ */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}
.modal-content {
  background: var(--white);
  padding: 24px;
  border-radius: var(--radius);
  width: 90%;
  max-width: 400px;
  box-shadow: var(--shadow-lg);
}
.modal-content h3 {
  margin-bottom: 16px;
  color: var(--green-dark);
}
.modal-content label {
  display: block;
  font-size: 14px;
  color: var(--gray-700);
  margin-bottom: 4px;
}
.modal-content input {
  width: 100%;
  padding: 8px 12px;
  margin-bottom: 14px;
  border: 1px solid var(--gray-200);
  border-radius: 6px;
  font-family: inherit;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.btn-submit {
  background: var(--green-main);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
}
.btn-cancel {
  background: var(--gray-200);
  color: var(--gray-700);
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-tabs" id="navTabsContainer">
    <button class="tab-btn active" onclick="switchTab('home')">หน้าหลัก</button>
    <button class="tab-btn" onclick="switchTab('coop')">ร้านค้าสหกรณ์</button>
    
    <!-- แถบรายการใหม่ที่เพิ่มเข้ามาระหว่าง ร้านค้าสหกรณ์ กับ Tracking งาน -->
    <a href="https://your-link-here.com" target="_blank" class="tab-btn link-tab">เครื่องเขียน 🔗</a>
    <a href="https://your-link-here.com" target="_blank" class="tab-btn link-tab">สมุดรายวันรับ-จ่าย 🔗</a>
    <a href="https://your-link-here.com" target="_blank" class="tab-btn link-tab">ทะเบียนทรัพย์สิน 🔗</a>
    
    <button class="tab-btn" onclick="switchTab('tracking')">Tracking งาน</button>
    <button class="tab-btn" onclick="switchTab('sheets')">Google Sheets</button>
    <button class="tab-btn" onclick="switchTab('branches')">สาขา</button>
    <button class="tab-btn" onclick="switchTab('team')">ทีมงาน</button>
    
    <!-- ปุ่ม + สำหรับเพิ่มแถบรายการแนบลิงก์ในอนาคต -->
    <button class="add-tab-btn" id="addTabBtn" onclick="openModal()" title="เพิ่มแถบรายการ">+ </button>
  </div>
</header>

<!-- Modal ป๊อปอัปรับค่าแถบรายการใหม่ -->
<div class="modal-overlay" id="addTabModal">
  <div class="modal-content">
    <h3>เพิ่มแถบรายการใหม่</h3>
    <label for="tabTitle">ชื่อแถบรายการ</label>
    <input type="text" id="tabTitle" placeholder="เช่น รายงานงบประมาณ">
    
    <label for="tabUrl">ลิงก์ URL (https://...)</label>
    <input type="url" id="tabUrl" placeholder="https://docs.google.com/...">
    
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-submit" onclick="addNewTab()">บันทึก</button>
    </div>
  </div>
</div>

<script>
function switchTab(tabId) {
  const buttons = document.querySelectorAll('.tab-btn');
  buttons.forEach(btn => btn.classList.remove('active'));
  if (event && event.target) {
    event.target.classList.add('active');
  }
}

function openModal() {
  document.getElementById('addTabModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('addTabModal').style.display = 'none';
  document.getElementById('tabTitle').value = '';
  document.getElementById('tabUrl').value = '';
}

function addNewTab() {
  const title = document.getElementById('tabTitle').value.trim();
  const url = document.getElementById('tabUrl').value.trim();

  if (!title || !url) {
    alert('กรุณากรอกข้อมูลให้ครบถ้วน');
    return;
  }

  const container = document.getElementById('navTabsContainer');
  const addBtn = document.getElementById('addTabBtn');

  const newLink = document.createElement('a');
  newLink.href = url;
  newLink.target = '_blank';
  newLink.className = 'tab-btn link-tab';
  newLink.textContent = `${title} 🔗`;

  container.insertBefore(newLink, addBtn);
  closeModal();
}
</script>

</body>
</html>
